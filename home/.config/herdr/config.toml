onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Prefix and pane resizing carried over from the old tmux config; everything
# else is herdr stock.
prefix = "ctrl+;"
resize_pane_left = "prefix+["
resize_pane_right = "prefix+]"
resize_pane_up = "prefix+="
toggle_sidebar = "prefix+b"

# Workspace movement, mirroring focus_pane_left/right one level up.
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
switch_workspace = "ctrl+1..9"
